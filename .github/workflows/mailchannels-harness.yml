# Fork-only CI for OVERLORD-29 (not part of the upstream pull request).
name: mailchannels-harness

on:
  push:
    branches: ["agent/overlord-29/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behaviour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r mailchannels_harness/requirements.txt
      - name: Behaviour script (synthetic data, stub Email API)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python mailchannels_harness/run_behaviour.py behaviour-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behaviour-report
          path: behaviour-report.json

  tox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { tox: "lint,docs", python: "3.14" }
          - { tox: django60-py314-all, python: "3.14" }
          - { tox: django60-py314-mailchannels, python: "3.14" }
          - { tox: django50-py310-all, python: "3.10" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.config.python }}
      - run: python -m pip install --upgrade pip tox
      - run: tox -e ${{ matrix.config.tox }}
